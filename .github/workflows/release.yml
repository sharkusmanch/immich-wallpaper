name: Release

# Pushing a tag vX.Y.Z builds, signs, attests and publishes that version.
#
# The checks inside this file are conveniences, not the security boundary:
# whoever can push a tag also controls this file at that commit. The gates
# that hold are set on the repository, outside the workflow:
#   - a ruleset allows only repository admins to create v* tags, and nobody
#     to move or delete them;
#   - the "release" environment is limited to v* tags and waits for a named
#     reviewer to approve each run.
# In this repository the signing secrets are also repository secrets, because
# ordinary CI builds sign debug APKs with the same key so they install over
# each other on the owner's phone. The environment therefore gates the release
# run, not access to the key.
on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Holds the signing key and runs the build. Its token can only read the
  # repository: it cannot attest or create a release.
  build:
    name: Build and sign
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check version and tag
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^ *versionName = "\(.*\)"$/\1/p' app/build.gradle.kts)
          if [ -z "$version" ]; then
            echo "::error::Could not read versionName from app/build.gradle.kts"
            exit 1
          fi
          if [ "$REF_TYPE" != "tag" ] || [ "$REF_NAME" != "v$version" ]; then
            echo "::error::Ref $REF_NAME does not match versionName $version"
            exit 1
          fi
          # Only release commits that are on main.
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Tagged commit is not on main"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17

      # No build cache for releases: nothing from an earlier run can reach the signed APK.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: true

      - name: Check button rows
        run: python3 scripts/check-layouts.py

      - name: Test
        run: ./gradlew --no-daemon --console=plain :core:test :app:testDebugUnitTest

      - name: Build signed release APK
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_B64" ] || [ -z "$SIGNING_STORE_PASSWORD" ] || [ -z "$SIGNING_KEY_ALIAS" ]; then
            echo "::error::Signing secrets are missing"
            exit 1
          fi
          export SIGNING_KEYSTORE_FILE="$RUNNER_TEMP/release.p12"
          (umask 077 && printf '%s' "$SIGNING_KEYSTORE_B64" | base64 --decode > "$SIGNING_KEYSTORE_FILE")
          trap 'rm -f "$SIGNING_KEYSTORE_FILE"' EXIT
          ./gradlew --no-daemon --console=plain :app:assembleRelease

      - name: Verify signature
        env:
          EXPECTED_CERT_SHA256: ${{ vars.SIGNING_CERT_SHA256 }}
        run: |
          apk="app/build/outputs/apk/release/app-release.apk"
          actual=$(scripts/apk-cert-sha256.sh "$apk")
          if [ -z "$EXPECTED_CERT_SHA256" ] || [ "$actual" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::APK is signed with certificate $actual, not the expected one"
            exit 1
          fi

      # Same check as ci.yaml, on the APK that will be published.
      - name: Permissions are unchanged
        run: |
          aapt2="$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)"
          "$aapt2" dump permissions app/build/outputs/apk/release/app-release.apk \
            | grep "uses-permission" | sort > permissions.txt
          cat permissions.txt
          diff ci/permissions.txt permissions.txt

      - name: Collect release files
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir dist
          cp app/build/outputs/apk/release/app-release.apk "dist/immich-wallpaper-$VERSION.apk"
          (cd dist && sha256sum "immich-wallpaper-$VERSION.apk" > "immich-wallpaper-$VERSION.apk.sha256")
          cat dist/*.sha256

      - name: Upload release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: immich-wallpaper-release
          path: dist/
          if-no-files-found: error
          retention-days: 30

  # Records a signed statement that this exact file was built by this workflow
  # from this commit. Kept apart from the build so that no build script or
  # dependency ever runs with the right to issue attestations.
  attest:
    name: Attest provenance
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      id-token: write # proves this workflow's identity when signing the attestation
      attestations: write # stores the build provenance attestation

    steps:
      - name: Download release files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: immich-wallpaper-release
          path: dist

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.apk

  # Publishes the files the build job produced. It can write releases but
  # never sees the signing key and runs no code from the repository.
  publish:
    name: Publish GitHub release
    needs: [build, attest]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # creates the GitHub release

    steps:
      - name: Download release files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: immich-wallpaper-release
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          (cd dist && sha256sum --check ./*.sha256)
          gh release create "$TAG" dist/* --title "Immich Wallpaper $TAG" --generate-notes --verify-tag
