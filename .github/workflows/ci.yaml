name: ci

on:
  push:
    branches: ["**"]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_B64" ]; then
            echo "$SIGNING_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/signing.p12"
            echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/signing.p12" >> "$GITHUB_ENV"
          fi

      - name: Test and build
        run: |
          # assembleRelease on every push: R8 and resource shrinking break in ways a
          # debug build never shows, and a tag is too late to find out.
          tasks=":app:testDebugUnitTest :app:assembleDebug :app:assembleRelease"
          if [ -d core ]; then tasks=":core:test $tasks"; fi
          ./gradlew --console=plain $tasks

      # Upstream was never linted; report without failing the build.
      - name: Lint (report only)
        continue-on-error: true
        run: ./gradlew --console=plain :app:lintDebug

      - name: Verify the shared signing key was used
        if: env.SIGNING_KEYSTORE_FILE != ''
        run: |
          apksigner="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          "$apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | tee certs.txt
          grep -q "CN=Immich Wallpaper fork" certs.txt

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # The fork must not ask for more than upstream does (no new permissions, no
      # foreground service). ci/permissions.txt is the list from the first fork build.
      - name: Permissions are unchanged
        run: |
          aapt2="$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)"
          "$aapt2" dump permissions app/build/outputs/apk/debug/app-debug.apk \
            | grep "uses-permission" | sort > permissions.txt
          cat permissions.txt
          if [ -f ci/permissions.txt ]; then diff ci/permissions.txt permissions.txt; fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            permissions.txt
            core/build/reports/tests
            app/build/reports
          if-no-files-found: ignore

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "immich-wallpaper-${GITHUB_REF_NAME#v}.apk"
          gh release create "$GITHUB_REF_NAME" "immich-wallpaper-${GITHUB_REF_NAME#v}.apk" \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
